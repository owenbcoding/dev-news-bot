# dev-news-bot — for Raspberry Pi / Portainer
# Build: docker compose build
# Run:   docker compose up -d
# Local: put DISCORD_TOKEN, CHANNEL_ID in .env (Compose loads it for substitution).
# Portainer: add the same vars in the Stack → Environment variables.

services:
  dev-news-bot:
    build: .
    image: dev-news-bot:latest
    container_name: dev-news-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DEV_CHANNEL_ID=${DEV_CHANNEL_ID:-}
      - CHANNEL_ID=${CHANNEL_ID}
      - ARCHIVE_PATH=/data/dev_news_archive.jsonl
      - DEDUPE_INDEX_PATH=/data/dev_news_dedupe.json
      - MAX_POSTS_PER_RUN=${MAX_POSTS_PER_RUN:-8}
      - MAX_PER_SOURCE=${MAX_PER_SOURCE:-2}
      - SEND_TEXT_DIGEST=${SEND_TEXT_DIGEST:-false}
    volumes:
      - dev-news-bot-data:/data

volumes:
  dev-news-bot-data:
